<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LYRA Creative Universe</title>
    <link rel="stylesheet" href="style.css?v=gallery-20261025">
    <script src="script.js?v=gallery-20261025" defer></script>
  </head>
  <body>
    <main class="stage is-zh" aria-label="LYRA Creative Universe">
      <h1 class="sr-only">LYRA Creative Universe</h1>
      <button class="light-toggle" type="button" aria-pressed="false">
        <span class="light-toggle-icon" aria-hidden="true"></span>
        <span class="light-toggle-text">LIGHT OFF</span>
      </button>
      <button class="language-toggle" type="button" aria-label="Switch language to English" aria-pressed="true">
        <span data-language-text>英</span>
      </button>

      <nav class="nav-hotspots" aria-label="Primary">
        <a class="hotspot nav-home" href="#home" data-en="Home" data-zh="首頁">首頁</a>
        <a class="hotspot nav-vizion" href="#vizion-system" data-en="Vizion System" data-zh="視覺系統">視覺系統</a>
        <a class="hotspot nav-calendar" href="#daily-calendar" data-en="Daily Calendar" data-zh="每日曆">每日曆</a>
        <a class="hotspot nav-music" href="#music" data-en="Music" data-zh="音樂">音樂</a>
        <a class="hotspot nav-writing" href="#writing" data-en="Writing" data-zh="寫作">寫作</a>
        <a class="hotspot nav-brand" href="#vanchuan-design" data-en="Brand &amp; Website" data-zh="品牌與網站">品牌與網站</a>
        <a class="hotspot nav-articles" href="#articles" data-en="Articles" data-zh="文章">文章</a>
        <a class="hotspot nav-consultation" href="book-a-consultation/index.html" data-en="Consultation" data-zh="諮詢">諮詢</a>
      </nav>

      <section class="hero-logo" id="home" aria-label="LYRA Creative Universe">
        <img class="hero-logo-art" src="assets/hero-logo-figure-2.png" alt="" aria-hidden="true">
        <div class="logo-rule left-rule"></div>
        <div class="logo-rule right-rule"></div>
        <div class="logo-orb left-orb"></div>
        <div class="logo-orb right-orb"></div>
        <p class="hello">Hello</p>
        <div class="lyra-panel">
          <span class="lyra-word" aria-label="LYRA">
            <span class="lyra-letter">L</span><span class="lyra-letter">Y</span><span class="lyra-letter">R</span><span class="lyra-letter">A</span>
          </span>
        </div>
        <div class="short-line" aria-hidden="true"></div>
        <p class="universe">Creative Universe</p>
      </section>

      <section class="portrait-scene" aria-label="Portrait">
        <img src="assets/portrait-scene.png" alt="">
      </section>

      <section class="folder-grid" aria-label="Creative sections">
        <a class="folder folder-vizion" id="vizion-system" href="#vizion-system">
          <img src="assets/folder-vizion-icon.png" alt="">
          <span data-en="Vizion System" data-zh="視覺系統">視覺系統</span>
        </a>
        <a class="folder folder-calendar" id="daily-calendar" href="#daily-calendar">
          <img src="assets/folder-calendar-icon.png" alt="">
          <span data-en="Daily<br>Calendar" data-zh="每日曆">每日曆</span>
        </a>
        <a class="folder folder-music" id="music" href="#music">
          <img src="assets/folder-music-icon.png" alt="">
          <span data-en="Music" data-zh="音樂">音樂</span>
        </a>
        <a class="folder folder-writing" id="writing" href="#writing">
          <img src="assets/folder-writing-icon.png" alt="">
          <span data-en="Writing" data-zh="寫作">寫作</span>
        </a>
        <a class="folder folder-brand" id="brand" href="#vanchuan-design">
          <img src="assets/folder-brand-icon.png" alt="">
          <span data-en="Brand &amp; Website" data-zh="品牌與網站">品牌與網站</span>
        </a>
        <a class="folder folder-articles" id="articles" href="#articles">
          <img src="assets/folder-articles-icon.png" alt="">
          <span data-en="Articles" data-zh="文章">文章</span>
        </a>
        <a class="folder folder-loveu-rabbit" id="loveu-rabbit" href="#loveu-rabbit">
          <img src="assets/folder-consultation-icon.png" alt="">
          <span data-en="LoveU兔" data-zh="LoveU兔">LoveU兔</span>
        </a>
        <a class="folder folder-gallery" id="gallery" href="#gallery">
          <img src="assets/folder-articles-icon.png" alt="">
          <span data-en="Gallery" data-zh="藝廊">藝廊</span>
        </a>
        <a class="folder folder-consultation" id="consultation" href="book-a-consultation/index.html">
          <img src="assets/folder-consultation-icon.png" alt="">
          <span data-en="Consultation" data-zh="諮詢">諮詢</span>
        </a>
      </section>

      <form class="message-form" action="#" aria-label="Send Message">
        <label class="sr-only" for="message" data-en="Send Message" data-zh="傳送訊息">傳送訊息</label>
        <input id="message" name="message" type="text" autocomplete="off" aria-label="傳送訊息" placeholder="想說些什麼？" data-placeholder-en="What's on your mind?" data-placeholder-zh="想說些什麼？">
        <button type="submit" aria-label="傳送訊息" data-aria-en="Send message" data-aria-zh="傳送訊息">
          <img src="assets/send-plane-icon.png" alt="">
        </button>
      </form>

      <p class="credit">BY LYRA</p>
      <section class="brand-website-view" aria-label="Brand Website" aria-hidden="true" style="position: fixed; inset: 0; z-index: 9999; display: none; width: 100vw; height: 100vh; background: #f2f2ef;">
        <iframe
          title="Brand Website"
          src="https://mina4272.github.io/j_home/Codex/lyra-design-no-filter/?v=7d674b349c88"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          style="display: block; width: 100%; height: 100%; border: 0; background: #f2f2ef;"
        ></iframe>
      </section>
      <section class="articles-view" aria-label="K-pop Culture" aria-hidden="true" style="position: fixed; inset: 0; z-index: 10000; display: none; width: 100vw; height: 100vh; background: #f4efe4;">
        <iframe
          title="K-pop Culture"
          src="articles/kpop-culture/kpop-culture.html?v=80feab2e"
          loading="lazy"
          style="display: block; width: 100%; height: 100%; border: 0; background: #f4efe4;"
        ></iframe>
      </section>
      <section class="gallery-desktop" aria-label="Creative Flow Lab Gallery" aria-hidden="true">
        <button class="gallery-desktop-icon" type="button" data-gallery-open aria-label="Open Gallery">
          <img src="assets/folder-articles-icon.png" alt="">
          <span>Gallery</span>
        </button>

        <section class="gallery-window" role="dialog" aria-modal="false" aria-labelledby="gallery-title">
          <header class="gallery-titlebar" data-gallery-drag>
            <h2 id="gallery-title">Gallery</h2>
            <div class="gallery-window-controls">
              <button type="button" data-gallery-minimize aria-label="Minimize Gallery">&#8722;</button>
              <button type="button" data-gallery-maximize aria-label="Maximize Gallery">&#9633;</button>
              <button type="button" data-gallery-close aria-label="Close Gallery">&#215;</button>
            </div>
          </header>

          <div class="gallery-toolbar" aria-label="Gallery tools">
            <label class="gallery-tool-button">
              <input type="file" accept="image/*" multiple data-gallery-upload>
              <span aria-hidden="true">+</span> Upload images
            </label>
            <button class="gallery-tool-button" type="button" data-gallery-delete disabled>
              <span aria-hidden="true">&#128465;</span> Delete selected
            </button>
            <span class="gallery-status" data-gallery-status aria-live="polite"></span>
          </div>

          <div class="gallery-grid" aria-label="Gallery images">
            <button class="gallery-file" type="button" data-gallery-id="default-0" data-gallery-kind="default"><img src="assets/site-art-reference-1200.png" alt="LYRA Creative Universe homepage"><span>lyra_01</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-1" data-gallery-kind="default"><img src="assets/portrait-scene.png" alt="LYRA portrait scene"><span>lyra_02</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-2" data-gallery-kind="default"><img src="assets/dark-portrait-scene.png" alt="LYRA neon portrait"><span>lyra_03</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-3" data-gallery-kind="default"><img src="assets/dark-room-bg.png" alt="LYRA dark room"><span>lyra_04</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-4" data-gallery-kind="default"><img src="assets/hero-logo-figure-2.png" alt="LYRA neon logo"><span>lyra_05</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-5" data-gallery-kind="default"><img src="articles/kpop-culture/assets/hero-room.jpg" alt="Editorial room"><span>editorial_01</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-6" data-gallery-kind="default"><img src="articles/kpop-culture/assets/listening-room.jpg" alt="Listening room"><span>editorial_02</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-7" data-gallery-kind="default"><img src="articles/kpop-culture/assets/manifesto.jpg" alt="Editorial manifesto"><span>editorial_03</span></button>
            <button class="gallery-file" type="button" data-gallery-id="default-8" data-gallery-kind="default"><img src="articles/kpop-culture/assets/abbey-road.jpg" alt="Abbey Road feature"><span>editorial_04</span></button>
          </div>

          <div class="gallery-viewer" aria-hidden="true">
            <header>
              <span data-gallery-caption>lyra_01</span>
              <div class="gallery-viewer-actions">
                <button type="button" data-gallery-delete disabled aria-label="Delete image">&#128465;</button>
                <button type="button" data-gallery-viewer-close aria-label="Close image">&#215;</button>
              </div>
            </header>
            <div class="gallery-viewer-stage">
              <button type="button" class="gallery-viewer-nav is-prev" data-gallery-prev aria-label="Previous image">&#8249;</button>
              <img data-gallery-viewer-image src="assets/site-art-reference-1200.png" alt="">
              <button type="button" class="gallery-viewer-nav is-next" data-gallery-next aria-label="Next image">&#8250;</button>
            </div>
          </div>
        </section>

        <footer class="gallery-taskbar">
          <a href="#home" class="gallery-start">LYRA</a>
          <button type="button" data-gallery-open><span aria-hidden="true">&#10148;</span> Gallery</button>
        </footer>
      </section>
      <audio id="bubble-pop-sound" src="assets/glossy-bubble-pop.wav" preload="auto"></audio>
    </main>
  </body>
</html>
